<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flibin.de5.net</title>
<style>
  :root{--bg:#0b0d12;--fg:#e6e8ee;--dim:#8b93a7;--accent:#5b8cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
       font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  main{max-width:560px;text-align:center}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;
       box-shadow:0 0 0 0 rgba(91,140,255,.6);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(91,140,255,0)}100%{box-shadow:0 0 0 0 rgba(91,140,255,0)}}
  h1{font-size:1.6rem;margin:18px 0 10px;letter-spacing:.5px}
  p{color:var(--dim);margin-bottom:8px}
  code{background:#161a24;padding:2px 7px;border-radius:5px;color:var(--accent);font-size:.9em}
  footer{margin-top:28px;font-size:.85rem;color:#5a6274}
</style>
</head>
<body>
<main>
  <span class="dot"></span>
  <h1>flibin.de5.net</h1>
  <p>站点正在搭建中，很快就好。</p>
  <p>邮件联络：<code>hello@flibin.de5.net</code></p>
  <footer>本域不接收邮件，请勿直接回复。</footer>
</main>
</body>
</html>
