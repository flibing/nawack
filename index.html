<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本地JSON工具 - TVBox｜完整jsonrepair单离线文件</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
:root{
  --bg:#f5f6f7;
  --text:#222;
  --panel-bg:#fff;
  --panel-border:#ddd;
  --panel-header:#eef2ff;
  --input-bg:#fff;
  --tree-key:#92400e;
  --tree-string:#16a34a;
  --tree-num:#2563eb;
  --tree-bool:#7c3aed;
  --tree-null:#888;
}
.dark{
  --bg:#1e1e1e;
  --text:#e0e0e0;
  --panel-bg:#2d2d2d;
  --panel-border:#444;
  --panel-header:#333842;
  --input-bg:#252526;
  --tree-key:#ffc66d;
  --tree-string:#a5d6ff;
  --tree-num:#4ec9b0;
  --tree-bool:#c586c0;
  --tree-null:#8a8a8a;
}
body{padding:16px;background:var(--bg);color:var(--text);transition:0.2s}
.container{max-width:1400px;margin:0 auto}
.top-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
button{padding:8px 14px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
button.secondary{background:#666}
button.danger{background:#dc2626}
button.fix{background:#059669;}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 140px)}
.panel{display:flex;flex-direction:column;background:var(--panel-bg);border-radius:8px;overflow:hidden;border:1px solid var(--panel-border)}
.panel h3{padding:10px;background:var(--panel-header);margin:0;font-size:15px;color:var(--text)}
textarea{flex:1;width:100%;padding:12px;border:none;outline:none;font-family:Consolas,monospace;font-size:13px;resize:none;background:var(--input-bg);color:var(--text)}
#tree{flex:1;padding:12px;overflow:auto;font-family:Consolas;font-size:13px;background:var(--panel-bg);color:var(--text)}
.error{color:#ff4d4f;font-weight:bold;margin:8px 0}
.success{color:#36d399;font-weight:bold;margin:8px 0}
.tree-key{color:var(--tree-key)}
.tree-string{color:var(--tree-string)}
.tree-num{color:var(--tree-num)}
.tree-bool{color:var(--tree-bool)}
.tree-null{color:var(--tree-null)}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <input type="file" id="fileInput" accept=".json">
    <button id="btnFormat">✅ 格式化美化</button>
    <button id="btnCompress">📦 压缩成一行</button>
    <button id="btnTree">🌳 生成树形预览</button>
    <button class="fix" id="btnRepair">🔧自动修复</button>
    <button class="secondary" id="btnCopy">📋 复制文本</button>
    <button id="btnDownload">💾 导出JSON文件</button>
    <button id="btnTheme">🌓 深色/浅色</button>
    <button class="danger" id="btnClear">🗑️ 清空全部</button>
    <div id="msg"></div>
  </div>
  <div class="wrap">
    <div class="panel">
      <h3>JSON输入（粘贴json内容 / 选择本地json文件）</h3>
      <textarea id="input" placeholder="粘贴你的json内容在这里，或者直接选择上面的json文件加载"></textarea>
    </div>
    <div class="panel">
      <h3>结果 / 树形预览</h3>
      <div id="tree"></div>
    </div>
  </div>
</div>

const $ = s => document.querySelector(s);
const msgBox = $('#msg');
const fileInput = $('#fileInput');
const inputTextarea = $('#input');

let treeDebounceTimer = null;
const DEBOUNCE_DELAY = 300;
inputTextarea.addEventListener('input', function () {
  clearTimeout(treeDebounceTimer);
  treeDebounceTimer = setTimeout(parseTree, DEBOUNCE_DELAY);
});
window.addEventListener('beforeunload', ()=> clearTimeout(treeDebounceTimer));

function showMsg(text, isErr=false){
  msgBox.className = isErr ? 'error' : 'success';
  msgBox.innerText = text;
}

function repairJson(){
  const txt = $('#input').value.trim();
  if(!txt){ showMsg("❌输入内容为空",true); return; }
  try{
    JSON.parse(txt);
    showMsg("✅JSON无需修复");
    return;
  }catch(err){}

  if(typeof JSONRepair?.jsonrepair !== "function"){
    showMsg("❌jsonrepair库未加载",true);
    return;
  }

  try{
      // 调用库修复
      const rawFixed = JSONRepair.jsonrepair(txt);
      // 修复完成之后自动格式化美化
      const obj = JSON.parse(rawFixed);
      const pretty = JSON.stringify(obj,null,2);
      $('#input').value = pretty;
      parseTree();
      showMsg("✅自动修复并美化完成！请人工核对修复结果！");
  }catch(e2){
    showMsg("❌修复失败："+e2.message,true);
  }
}

function formatJson(){
  const txt = $('#input').value.trim();
  try{
    const obj = JSON.parse(txt);
    $('#input').value = JSON.stringify(obj,null,2);
    parseTree();
    showMsg("✅ JSON校验通过，已美化");
  }catch(e){ showMsg("❌ JSON语法错误："+e.message,true); }
}

function compressJson(){
  const txt = $('#input').value.trim();
  try{
    const obj = JSON.parse(txt);
    $('#input').value = JSON.stringify(obj);
    parseTree();
    showMsg("✅ 压缩完成");
  }catch(e){ showMsg("❌ JSON语法错误："+e.message,true); }
}

function parseTree(){
  const txt = $('#input').value.trim();
  const treeDom = $('#tree');
  try{
    if(!txt){ treeDom.innerText = ""; msgBox.innerText = ""; return; }
    const obj = JSON.parse(txt);
    treeDom.innerHTML = renderTree(obj);
    showMsg("✅ 树形解析成功");
  }catch(e){
    treeDom.innerText = "JSON解析失败：" + e.message;
    showMsg("❌ JSON语法错误："+e.message,true);
  }
}

function renderTree(data){
  if(Array.isArray(data)){
    let html = '[<div style="padding-left:18px">';
    data.forEach((item,i)=> html += `<div>[${i}]: ${renderTree(item)}</div>`);
    html += '</div>]';
    return html;
  }else if(typeof data === 'object' && data!==null){
    let html = '{<div style="padding-left:18px">';
    for(let k in data){
      const v = data[k];
      html += `<div><span class="tree-key">"${k}"</span>: ${renderTree(v)}</div>`;
    }
    html += '</div>}';
    return html;
  }else if(typeof data === 'string'){
    return `<span class="tree-string">"${escapeHtml(data)}"</span>`;
  }else if(typeof data === 'number'){
    return `<span class="tree-num">${data}</span>`;
  }else if(typeof data === 'boolean'){
    return `<span class="tree-bool">${data}</span>`;
  }else if(data===null){
    return `<span class="tree-null">null</span>`;
  }
  return "";
}
function escapeHtml(str){
  return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}

function copyResult(){
  navigator.clipboard.writeText($('#input').value).then(()=>{
    showMsg("✅ 复制成功");
  }).catch(e=> showMsg("❌ 复制失败："+e.message,true));
}

function downloadJson(){
  const text = $('#input').value.trim();
  if(!text){ showMsg("❌ 内容为空，无法导出",true); return; }
  try{
    JSON.parse(text);
    const blob = new Blob([text], {type: 'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "json.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showMsg("✅ 文件已下载");
  }catch(e){ showMsg("❌ JSON语法错误，不能导出："+e.message,true); }
}

function toggleDark(){ document.body.classList.toggle('dark'); }

function clearAll(){
  $('#input').value = '';
  $('#tree').innerText = '';
  msgBox.innerText='';
  fileInput.value = '';
}

fileInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    $('#input').value = evt.target.result;
    parseTree();
    showMsg(`✅ 已加载文件：${file.name}`);
  }
  reader.readAsText(file);
}

$('#btnFormat').addEventListener('click',formatJson);
$('#btnCompress').addEventListener('click',compressJson);
$('#btnTree').addEventListener('click',parseTree);
$('#btnRepair').addEventListener('click',repairJson);
$('#btnCopy').addEventListener('click',copyResult);
$('#btnDownload').addEventListener('click',downloadJson);
$('#btnTheme').addEventListener('click',toggleDark);
$('#btnClear').addEventListener('click',clearAll);

if(typeof JSONRepair?.jsonrepair === "function"){
  showMsg("✅ jsonrepair已就绪，离线完整版");
}else{
  showMsg("❌ jsonrepair加载异常",true);
}
</script>
</body>
</html>
